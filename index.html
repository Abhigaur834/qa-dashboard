<!DOCTYPE html>
<html>
<head>
  <title>QA Hub</title>
  <style>
    body { font-family: Arial; background:#0b0f1a; color:white; }
    .tab { padding:10px; cursor:pointer; display:inline-block; }
    .active { color:#4ea1ff; }
    .panel { display:none; padding:20px; }
    .panel.active { display:block; }
  </style>
</head>

<body>

<h2>QA Hub Dashboard</h2>

<div>
  <span class="tab active" onclick="switchTab('scorecard',this)">Scorecard</span>
  <span class="tab" onclick="switchTab('aireview',this)">
    AI Audit (<span id="aiAuditBadge">0</span>)
  </span>
</div>

<div id="tab-scorecard" class="panel active">
  <h3>Scorecard</h3>
  <button onclick="saveAudit()">Save Dummy Audit</button>
</div>

<div id="tab-aireview" class="panel">
  <h3>AI Audits</h3>
  <pre id="aiDataBox">No data</pre>
</div>

<script>

const AI_API_BASE = "https://qahub-ai-api-glz7-71kxhi7f1-abhigaur834s-projects.vercel.app";

function switchTab(tab, el){
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");

  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.getElementById("tab-"+tab).classList.add("active");

  if(tab === "aireview"){
    fetchAIAudits();
  }
}

// 🔥 FETCH AI DATA
async function fetchAIAudits(){
  try{
    const res = await fetch(`${AI_API_BASE}/api/calls`, {
      method: "GET",
      headers: {
        "Content-Type": "application/json"
      }
    });

    const data = await res.json();

    document.getElementById("aiAuditBadge").innerText = data.length || 0;
    document.getElementById("aiDataBox").innerText = JSON.stringify(data, null, 2);

  }catch(err){
    document.getElementById("aiDataBox").innerText = "Error loading AI data";
    console.error(err);
  }
}

// 🔥 SAVE LOCAL DATA
function saveAudit(){
  let data = JSON.parse(localStorage.getItem("qaAudits")) || [];

  data.push({
    agent:"Abhi",
    score: Math.floor(Math.random()*100),
    time: new Date()
  });

  localStorage.setItem("qaAudits", JSON.stringify(data));

  alert("Saved locally ✅");
}

</script>

</body>
</html>
