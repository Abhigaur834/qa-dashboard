<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Intelligence Hub | Dynamic Operations</title>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;700;900&family=Onest:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060a12; --surface: #0c1220; --surface2: #111826; --surface3: #17202e;
            --border: #1c2640; --accent: #3d7ef5; --critical: #f04060; --success: #22d38a;
            --text: #e4ecf8; --text-dim: #8a9bb8; --muted: #4a5878;
            --font-head: 'Epilogue', sans-serif; --font-body: 'Onest', sans-serif;
        }

        body { background: var(--bg); color: var(--text); font-family: var(--font-body); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .hidden { display: none !important; }
        .admin-only { display: none; } /* Controlled by JS */

        /* UI Components */
        .card { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; overflow: hidden; padding: 20px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        
        .score-val { font-family: var(--font-head); font-size: 32px; font-weight: 800; }
        .fatal-alert { color: var(--critical) !important; border-color: var(--critical) !important; }

        .param-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); }
        .btn { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface3); color: var(--text); cursor: pointer; font-weight: 600; }
        .btn-yes.active { background: var(--success); color: #000; }
        .btn-no.active { background: var(--critical); color: #fff; }

        select, input, textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 6px; outline: none; box-sizing: border-box; }
        label { font-size: 11px; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 5px; }

        /* Login Overlay */
        #loginOverlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="card" style="width: 350px; text-align: center;">
        <h2 style="font-family: var(--font-head);">QA LOGIN</h2>
        <input type="email" id="logEmail" placeholder="Email" style="margin-bottom:10px;">
        <input type="password" id="logPass" placeholder="Password" style="margin-bottom:20px;">
        <button class="btn" style="width:100%; background: var(--accent);" id="btnLogin">Login</button>
    </div>
</div>

<div class="container hidden" id="mainDashboard">
    
    <div class="card admin-only">
        <h3 style="margin-top:0;">Admin Access Management</h3>
        <div class="grid-4" style="grid-template-columns: 2fr 1fr;">
            <input type="email" id="newAdminEmail" placeholder="Enter colleague's email to grant admin access">
            <button class="btn" id="btnGrant">Grant Admin Access</button>
        </div>
    </div>

    <div class="card">
        <div class="grid-4">
            <div><label>Call Date</label><input type="date" id="auditDate"></div>
            <div><label>Select Agent</label><select id="agentSelect"></select></div>
            <div><label>Reporting TL</label><select id="tlSelect"></select></div>
            <div><label>Week</label>
                <select id="weekSelect">
                    <option>Week 1</option><option>Week 2</option><option>Week 3</option><option>Week 4</option>
                </select>
            </div>
        </div>
    </div>

    <div class="grid-4">
        <div class="card" style="text-align: center;">
            <label>Total Score</label>
            <div class="score-val" id="displayScore">100%</div>
        </div>
        <div class="card" style="text-align: center;">
            <label>Fatal Status</label>
            <div class="score-val" id="displayFatal" style="color: var(--success);">PASS</div>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-top:0;">Audit Parameters</h3>
        <div id="parametersList"></div>
        
        <h3 style="color: var(--critical);">Critical Parameters (FATAL)</h3>
        <div id="fatalList"></div>
    </div>

    <div class="card">
        <label>Observations & Coaching Comments</label>
        <textarea id="coachingNotes" rows="4"></textarea>
        <button class="btn" style="width: 100%; background: var(--accent); margin-top: 20px; padding: 15px;" id="btnSubmit">Submit Final Audit</button>
    </div>
</div>



<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // REPLACE THIS WITH YOUR CONFIG
    const firebaseConfig = {
        databaseURL: "https://qa-dashboard-system-default-rtdb.asia-southeast1.firebasedatabase.app/",
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // --- State Management ---
    const params = [
        { name: "Standard opening & name confirmation", weight: 10 },
        { name: "Summarization", weight: 10 },
        { name: "Further assistance offered", weight: 5 },
        { name: "Prescribed call closing", weight: 10 },
        { name: "Paraphrasing for alignment", weight: 10 },
        { name: "VOC understood & acknowledged", weight: 10 },
        { name: "Relevant probing questions", weight: 10 },
        { name: "Active Listening", weight: 10 },
        { name: "Hold/Dead Air SLA", weight: 5 },
        { name: "Empathy & Politeness", weight: 5 },
        { name: "No Overlapping/Interruptions", weight: 10 },
        { name: "Accurate Email Sent", weight: 5 }
    ];
    const fatals = ["Professionalism & Compliance", "Inaccurate Information", "Call Avoidance"];
    
    let currentScores = params.map(p => p.weight);
    let isFatal = false;

    // --- UI Logic ---
    function renderParams() {
        const pList = document.getElementById('parametersList');
        pList.innerHTML = params.map((p, i) => `
            <div class="param-row">
                <div><strong>${p.name}</strong><br><small style="color:var(--muted)">Weight: ${p.weight} pts</small></div>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-yes active" onclick="updateScore(${i}, ${p.weight}, this)">Yes</button>
                    <button class="btn btn-no" onclick="updateScore(${i}, 0, this)">No</button>
                </div>
            </div>
        `).join('');

        const fList = document.getElementById('fatalList');
        fList.innerHTML = fatals.map((f, i) => `
            <div class="param-row" style="border-left: 4px solid var(--critical)">
                <div><strong>${f}</strong></div>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-yes active" onclick="setFatal(false, this)">Pass</button>
                    <button class="btn btn-no" onclick="setFatal(true, this)">Fatal</button>
                </div>
            </div>
        `).join('');
    }

    window.updateScore = (index, val, btn) => {
        currentScores[index] = val;
        toggleBtns(btn);
        calculate();
    };

    window.setFatal = (val, btn) => {
        isFatal = val;
        toggleBtns(btn);
        calculate();
    };

    function toggleBtns(btn) {
        Array.from(btn.parentElement.children).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function calculate() {
        const total = currentScores.reduce((a, b) => a + b, 0);
        const scoreDisplay = document.getElementById('displayScore');
        const fatalDisplay = document.getElementById('displayFatal');

        if (isFatal) {
            scoreDisplay.innerText = "0%";
            scoreDisplay.classList.add('fatal-alert');
            fatalDisplay.innerText = "FAIL";
            fatalDisplay.classList.add('fatal-alert');
        } else {
            scoreDisplay.innerText = total + "%";
            scoreDisplay.classList.remove('fatal-alert');
            fatalDisplay.innerText = "PASS";
            fatalDisplay.classList.remove('fatal-alert');
        }
    }

    // --- Firebase Logic ---

    // 1. Role Check (Admin/Manager vs TL)
    function checkPermissions(user) {
        onValue(ref(db, 'admins'), (snap) => {
            const admins = snap.val() || {};
            const isAdmin = Object.values(admins).some(a => a.email === user.email);
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = isAdmin ? 'block' : 'none');
        });
    }

    // 2. Load Dynamic Dropdowns (From Agents Node)
    function loadAgents() {
        onValue(ref(db, 'agents'), (snap) => {
            const data = snap.val() || {};
            const agentSelect = document.getElementById('agentSelect');
            const tlSelect = document.getElementById('tlSelect');
            
            agentSelect.innerHTML = '<option>Select Agent</option>';
            const tls = new Set();

            Object.values(data).forEach(a => {
                let opt = new Option(a.full_name, a.full_name);
                agentSelect.add(opt);
                if(a.tl_name) tls.add(a.tl_name);
            });

            tlSelect.innerHTML = '<option>Select TL</option>';
            tls.forEach(t => tlSelect.add(new Option(t, t)));
        });
    }

    // 3. Login
    document.getElementById('btnLogin').onclick = () => {
        const e = document.getElementById('logEmail').value;
        const p = document.getElementById('logPass').value;
        signInWithEmailAndPassword(auth, e, p).catch(err => alert(err.message));
    };

    // 4. Submit Audit
    document.getElementById('btnSubmit').onclick = () => {
        const auditData = {
            agent: document.getElementById('agentSelect').value,
            tl: document.getElementById('tlSelect').value,
            score: document.getElementById('displayScore').innerText,
            isFatal: isFatal,
            date: document.getElementById('auditDate').value,
            week: document.getElementById('weekSelect').value,
            auditor: auth.currentUser.email,
            timestamp: Date.now()
        };
        push(ref(db, 'audits'), auditData).then(() => alert("Audit Saved!"));
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('loginOverlay').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            checkPermissions(user);
            loadAgents();
            renderParams();
        }
    });
</script>
</body>
</html>
