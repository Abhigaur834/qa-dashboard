<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Performance Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700;800;900&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#060a12;--surface:#0c1220;--surface2:#111826;--surface3:#17202e;
  --border:#1c2640;--border-bright:#263354;
  --accent:#3d7ef5;--accent-dim:rgba(61,126,245,0.12);
  --accent2:#f0a830;--accent2-dim:rgba(240,168,48,0.12);
  --critical:#f04060;--critical-dim:rgba(240,64,96,0.12);
  --success:#22d38a;--success-dim:rgba(34,211,138,0.12);
  --warning:#f08040;
  --purple:#8b6cf5;--purple-dim:rgba(139,108,245,0.12);
  --text:#e4ecf8;--text-dim:#8a9bb8;--muted:#4a5878;
  --font-head:'Epilogue',sans-serif;--font-body:'Onest',sans-serif;
  --r-lg:16px;--r-md:12px;--r-sm:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;line-height:1.5;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 15% 10%,rgba(61,126,245,0.08) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 85% 85%,rgba(139,108,245,0.06) 0%,transparent 60%);pointer-events:none;z-index:0;}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px 60px;position:relative;z-index:1;}
.hdr{padding:28px 0 24px;border-bottom:1px solid var(--border);margin-bottom:28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.brand{font-family:var(--font-head);font-weight:900;font-size:22px;letter-spacing:-0.5px;}
.brand .dot{color:var(--accent);}
.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-weight:600;margin-top:2px;}
.updated{font-size:11.5px;color:var(--muted);text-align:right;}
.updated strong{color:var(--text-dim);}
h1{font-family:var(--font-head);font-size:26px;font-weight:800;letter-spacing:-0.5px;margin-bottom:6px;}
.sub{color:var(--muted);font-size:13px;margin-bottom:28px;}
.sec-title{font-family:var(--font-head);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin:36px 0 14px;display:flex;align-items:center;gap:10px;}
.sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
.kpi{background:linear-gradient(145deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.kpi.blue::before{background:linear-gradient(90deg,var(--accent),transparent);}
.kpi.green::before{background:linear-gradient(90deg,var(--success),transparent);}
.kpi.yellow::before{background:linear-gradient(90deg,var(--accent2),transparent);}
.kpi.red::before{background:linear-gradient(90deg,var(--critical),transparent);}
.kpi.purple::before{background:linear-gradient(90deg,var(--purple),transparent);}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);margin-bottom:10px;font-weight:600;font-family:var(--font-head);}
.kpi-val{font-family:var(--font-head);font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1;}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:6px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.card{background:linear-gradient(145deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;}
.card-hdr{padding:14px 20px;border-bottom:1px solid var(--border);font-family:var(--font-head);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;background:rgba(255,255,255,0.015);}
.chart-wrap{padding:20px;}
table{width:100%;border-collapse:collapse;}
thead th{padding:11px 16px;text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);background:rgba(255,255,255,0.02);font-family:var(--font-head);}
tbody td{padding:11px 16px;font-size:13px;border-bottom:1px solid rgba(28,38,64,0.5);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:rgba(61,126,245,0.03);}
.tag{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;font-family:var(--font-head);display:inline-block;}
.tp{background:var(--success-dim);color:var(--success);}
.tr{background:rgba(240,128,64,0.1);color:var(--warning);}
.tf{background:var(--critical-dim);color:var(--critical);}
.rank{font-family:var(--font-head);font-weight:800;color:var(--muted);width:28px;display:inline-block;}
.empty{text-align:center;padding:80px 20px;color:var(--muted);}
.empty h2{font-family:var(--font-head);font-size:18px;color:var(--text-dim);margin-bottom:8px;}
.footer{margin-top:50px;padding-top:24px;border-top:1px solid var(--border);text-align:center;font-size:11px;color:var(--muted);}
@media(max-width:1000px){.kpi-row{grid-template-columns:repeat(2,1fr);}.g2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="brand">QA<span class="dot">.</span>Hub<small>Performance Dashboard · By Opslyft</small></div>
    <div class="updated" id="updatedLabel">Loading…</div>
  </div>
  <div id="content">
    <div class="empty"><h2>Loading dashboard…</h2></div>
  </div>
  <div class="footer">This is a read-only performance summary. No call recordings, customer numbers, or internal notes are included in this view.</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const fc={apiKey:"AIzaSyCifkNrq_PA8FtW7devgVsaNGXW-Tce0n8",authDomain:"qa-dashboard-system.firebaseapp.com",databaseURL:"https://qa-dashboard-system-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"qa-dashboard-system",storageBucket:"qa-dashboard-system.appspot.com",messagingSenderId:"373240224146",appId:"1:373240224146:web:80576d03fea68b3583894b"};
const app=initializeApp(fc), db=getDatabase(app);

const params=new URLSearchParams(location.search);
const processId=(params.get('process')||'HOUS').toUpperCase();

function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function stag(p){return p===null||p===undefined?'–':p>=85?'<span class="tag tp">Pass</span>':p>=70?'<span class="tag tr">Review</span>':'<span class="tag tf">Fail</span>';}
function scoreColor(p){return p===null||p===undefined?'var(--muted)':p>=85?'var(--success)':p>=70?'var(--warning)':'var(--critical)';}

async function load(){
  try{
    const snap=await get(ref(db,`publicDashboards/${processId}`));
    if(!snap.exists()){
      document.getElementById('content').innerHTML=`<div class="empty"><h2>No dashboard published yet for "${esc(processId)}"</h2><p>Ask your QA admin to click "Publish Stakeholder Dashboard" in QA.Hub.</p></div>`;
      document.getElementById('updatedLabel').textContent='';
      return;
    }
    const d=snap.val();
    render(d);
  }catch(e){
    document.getElementById('content').innerHTML=`<div class="empty"><h2>Couldn't load dashboard</h2><p>${esc(e.message)}</p></div>`;
  }
}

function render(d){
  const genDate=d.generatedAt?new Date(d.generatedAt):null;
  document.getElementById('updatedLabel').innerHTML = genDate
    ? `Last updated<br><strong>${genDate.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}, ${genDate.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</strong>`
    : '';

  const k=d.kpis||{};
  const html = `
    <h1>${esc(d.processId||'')} — Quality Performance</h1>
    <div class="sub">Aggregated view across all completed audits for this process.</div>

    <div class="kpi-row">
      <div class="kpi blue"><div class="kpi-label">Avg QA Score</div><div class="kpi-val" style="color:${scoreColor(k.avgScore)}">${k.avgScore!==null&&k.avgScore!==undefined?k.avgScore+'%':'—'}</div><div class="kpi-sub">Across all audits</div></div>
      <div class="kpi green"><div class="kpi-label">Pass Rate</div><div class="kpi-val" style="color:var(--success)">${k.passRate!==null&&k.passRate!==undefined?k.passRate+'%':'—'}</div><div class="kpi-sub">≥85% threshold</div></div>
      <div class="kpi yellow"><div class="kpi-label">Total Audits</div><div class="kpi-val">${k.totalAudits??0}</div><div class="kpi-sub">All time on record</div></div>
      <div class="kpi red"><div class="kpi-label">Fatal Failures</div><div class="kpi-val" style="color:var(--critical)">${k.fatalCount??0}</div><div class="kpi-sub">${k.fatalRate??0}% of audits</div></div>
      <div class="kpi purple"><div class="kpi-label">Coaching Sessions</div><div class="kpi-val" style="color:var(--purple)">${d.coaching?.sessionsLogged??0}</div><div class="kpi-sub">${d.coaching?.avgImprovement!=null?(d.coaching.avgImprovement>=0?'+':'')+d.coaching.avgImprovement+'% avg impact':'No data yet'}</div></div>
    </div>

    <div class="sec-title">Score Trends</div>
    <div class="g2">
      <div class="card"><div class="card-hdr">Monthly QA Score</div><div class="chart-wrap" style="height:240px"><canvas id="monthlyChart"></canvas></div></div>
      <div class="card"><div class="card-hdr">Weekly QA Score</div><div class="chart-wrap" style="height:240px"><canvas id="weeklyChart"></canvas></div></div>
    </div>

    <div class="sec-title">Audit Volume &amp; Parameter Insights</div>
    <div class="g2">
      <div class="card"><div class="card-hdr">Audit Outcomes by Month</div><div class="chart-wrap" style="height:240px"><canvas id="volumeChart"></canvas></div></div>
      <div class="card"><div class="card-hdr">Top Failing Parameters</div><div class="chart-wrap" style="height:240px"><canvas id="paretoChart"></canvas></div></div>
    </div>

    <div class="sec-title">Agent Leaderboard</div>
    <div class="card" style="margin-bottom:8px">
      <div style="overflow-x:auto"><table>
        <thead><tr><th>#</th><th>Agent</th><th>Team</th><th>Audits</th><th style="width:160px">Avg Score</th><th>Pass Rate</th><th>Fatal</th><th>Result</th></tr></thead>
        <tbody>${(d.leaderboard||[]).map((ag,i)=>`<tr>
          <td class="rank">${i+1}</td>
          <td style="font-family:var(--font-head);font-weight:700">${esc(ag.name)}</td>
          <td style="color:var(--text-dim)">${esc(ag.team||'—')}</td>
          <td style="color:var(--muted)">${ag.evals}</td>
          <td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:4px;background:var(--border);border-radius:4px;overflow:hidden;max-width:80px"><div style="height:100%;width:${ag.avgScore||0}%;background:${scoreColor(ag.avgScore)}"></div></div><span style="font-family:var(--font-head);font-weight:700;color:${scoreColor(ag.avgScore)}">${ag.avgScore}%</span></div></td>
          <td style="color:var(--success)">${ag.passRate!=null?ag.passRate+'%':'—'}</td>
          <td>${ag.fatalCount>0?`<span class="tag tf">${ag.fatalCount}</span>`:'<span style="color:var(--muted);font-size:11px">0</span>'}</td>
          <td>${stag(ag.avgScore)}</td>
        </tr>`).join('')||'<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:24px">No agent data yet</td></tr>'}</tbody>
      </table></div>
    </div>

    ${(d.teamComparison||[]).length>1?`
    <div class="sec-title">Team Comparison</div>
    <div class="card">
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Team</th><th>Agents</th><th>Audits</th><th style="width:160px">Avg Score</th><th>Pass Rate</th></tr></thead>
        <tbody>${d.teamComparison.map(t=>`<tr>
          <td style="font-family:var(--font-head);font-weight:700">${esc(t.name)}</td>
          <td style="color:var(--muted)">${t.agents}</td>
          <td style="color:var(--muted)">${t.evals}</td>
          <td><span style="font-family:var(--font-head);font-weight:700;color:${scoreColor(t.avgScore)}">${t.avgScore!=null?t.avgScore+'%':'—'}</span></td>
          <td style="color:var(--success)">${t.passRate!=null?t.passRate+'%':'—'}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>`:''}
  `;
  document.getElementById('content').innerHTML=html;

  // Charts
  const monthly=d.monthlyTrend||[];
  new Chart(document.getElementById('monthlyChart'), {type:'bar',data:{labels:monthly.map(m=>m.label),datasets:[{data:monthly.map(m=>m.avgScore),backgroundColor:monthly.map(m=>m.avgScore>=85?'rgba(34,211,138,0.7)':m.avgScore>=70?'rgba(240,128,64,0.7)':'rgba(240,64,96,0.7)'),borderRadius:6}]},options:baseOpts()});

  const weekly=d.weeklyTrend||[];
  new Chart(document.getElementById('weeklyChart'), {type:'line',data:{labels:weekly.map(w=>w.label),datasets:[{data:weekly.map(w=>w.avgScore),borderColor:'rgba(139,108,245,0.85)',backgroundColor:'rgba(139,108,245,0.08)',borderWidth:2.5,pointRadius:3,tension:0.4,fill:true}]},options:baseOpts()});

  const vol=d.volumeByMonth||[];
  new Chart(document.getElementById('volumeChart'), {type:'bar',data:{labels:vol.map(v=>v.label),datasets:[
    {label:'Pass',data:vol.map(v=>v.pass),backgroundColor:'rgba(34,211,138,0.65)',borderRadius:4},
    {label:'Review',data:vol.map(v=>v.review),backgroundColor:'rgba(240,128,64,0.65)',borderRadius:4},
    {label:'Fail',data:vol.map(v=>v.fail),backgroundColor:'rgba(240,64,96,0.65)',borderRadius:4}
  ]},options:{...baseOpts(),plugins:{legend:{display:true,labels:{color:'#8a9bb8',font:{size:10},boxWidth:10}}},scales:{x:{stacked:true,ticks:{color:'#4a5878',font:{size:10}},grid:{display:false}},y:{stacked:true,ticks:{color:'#4a5878',font:{size:10}},grid:{color:'rgba(28,38,64,0.6)'}}}}});

  const pareto=d.paretoTop||[];
  new Chart(document.getElementById('paretoChart'), {type:'bar',indexAxis:'y',data:{labels:pareto.map(p=>p.label.length>28?p.label.slice(0,28)+'…':p.label),datasets:[{data:pareto.map(p=>p.failRate),backgroundColor:pareto.map(p=>p.type==='CR'?'rgba(240,64,96,0.7)':'rgba(61,126,245,0.6)'),borderRadius:4}]},options:{...baseOpts(),scales:{x:{max:100,ticks:{color:'#4a5878',font:{size:10},callback:v=>v+'%'},grid:{color:'rgba(28,38,64,0.6)'}},y:{ticks:{color:'#8a9bb8',font:{size:10}},grid:{display:false}}}}});
}

function baseOpts(){
  return {responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#4a5878',font:{size:10}},grid:{display:false}},y:{min:0,max:100,ticks:{color:'#4a5878',font:{size:10},callback:v=>v+'%'},grid:{color:'rgba(28,38,64,0.6)'}}}};
}

load();
</script>
</body>
</html>
