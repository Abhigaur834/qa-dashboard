<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA.Hub — Create Agent Login</title><link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;700;800;900&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#060a12;--s:#0c1220;--s2:#111826;--b:#1c2640;--b2:#2b3856;--a:#3d7ef5;--g:#22d38a;--r:#f04060;--t:#e8eef8;--m:#7f90ad}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,rgba(61,126,245,.10),transparent 35%),radial-gradient(circle at 90% 100%,rgba(139,108,245,.08),transparent 35%),var(--bg);color:var(--t);font-family:Onest,sans-serif}.wrap{max-width:980px;margin:auto;padding:34px 22px}.brand{font:900 19px Epilogue}.brand span{color:var(--a)}.sub{font-size:10px;color:var(--m);letter-spacing:1.8px;text-transform:uppercase;margin-top:4px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.secure{font-size:10px;color:var(--g)}.card{background:linear-gradient(145deg,var(--s),var(--s2));border:1px solid var(--b);border-radius:16px;overflow:hidden;margin-bottom:18px}.hdr{padding:15px 18px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center}.title{font:800 12px Epilogue;text-transform:uppercase;letter-spacing:.8px}.body{padding:19px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:9px;color:var(--m);font-weight:700;letter-spacing:1.1px;text-transform:uppercase;margin-bottom:6px}.field input,.field select{width:100%;background:#09101c;border:1px solid var(--b2);border-radius:9px;color:var(--t);padding:11px 12px;outline:none;font:500 12px Onest}.field input:focus,.field select:focus{border-color:var(--a)}.btn{border:1px solid var(--b2);background:var(--s2);color:var(--t);padding:11px 15px;border-radius:9px;cursor:pointer;font:700 11px Onest}.primary{background:var(--a);border-color:var(--a);color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:8px;margin-top:16px}.status{display:none;margin-top:14px;padding:10px 12px;border-radius:9px;border:1px solid var(--b);font-size:11px}.status.show{display:block}.ok{color:var(--g);background:rgba(34,211,138,.05);border-color:rgba(34,211,138,.2)}.err{color:var(--r);background:rgba(240,64,96,.05);border-color:rgba(240,64,96,.2)}.note{font-size:10px;color:var(--m);line-height:1.5;margin-top:7px}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:start;flex-direction:column;gap:10px}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="brand">QA<span>.</span>Hub</div><div class="sub">Agent Login Provisioning</div></div><div class="secure">● Admin-only</div></div>
<section class="card" id="loginCard"><div class="hdr"><div class="title">Admin Sign In</div></div><div class="body"><div class="grid"><div class="field"><label>Admin Email</label><input id="ae" type="email" placeholder="admin@company.com"></div><div class="field"><label>Admin Password</label><input id="ap" type="password" placeholder="••••••••"></div></div><div class="row"><button class="btn primary" id="signIn">Sign In</button></div><div class="status" id="loginStatus"></div></div></section>
<section class="card hidden" id="createCard"><div class="hdr"><div class="title">Create / Reset Agent Login</div><div class="secure" id="adminLabel"></div></div><div class="body"><div class="grid"><div class="field"><label>Process</label><select id="proc"><option value="">Select process...</option></select></div><div class="field"><label>Agent</label><select id="agent" disabled><option value="">Select process first</option></select></div><div class="field"><label>Login Email</label><input id="email" type="email" placeholder="agent@company.com"></div><div class="field"><label>Temporary Password</label><input id="pw" type="password" placeholder="Minimum 8 characters"></div></div><div class="note">For an existing Firebase account, the password is reset and the account is re-enabled. The agent profile is linked to the login by employee ID.</div><div class="row"><button class="btn primary" id="create" disabled>🔐 Create Agent Login</button><button class="btn" id="logout">Sign Out</button></div><div class="status" id="createStatus"></div></div></section>
</div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getDatabase,ref,get}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const firebaseConfig={apiKey:'FIREBASE_WEB_API_KEY',authDomain:'qa-dashboard-system.firebaseapp.com',databaseURL:'https://qa-dashboard-system-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'qa-dashboard-system',storageBucket:'qa-dashboard-system.appspot.com',messagingSenderId:'373240224146',appId:'FIREBASE_APP_ID'};
const API='https://qahub-ai-api-glz7.vercel.app';let app,db,auth;
const $=id=>document.getElementById(id);const SUPER='gaurabhi834@gmail.com';
function st(el,msg,ok=false){el.textContent=msg;el.className='status show '+(ok?'ok':'err')}
function ensureFirebase(){if(app)return;app=initializeApp(firebaseConfig);db=getDatabase(app);auth=getAuth(app)}
function configured(){return firebaseConfig.apiKey!=='FIREBASE_WEB_API_KEY'&&firebaseConfig.appId!=='FIREBASE_APP_ID'}
$('signIn').onclick=async()=>{if(!configured()){st($('loginStatus'),'Configure the Firebase web API key and app ID in this file before use.');return}ensureFirebase();const e=$('ae').value.trim(),p=$('ap').value;if(!e||!p){st($('loginStatus'),'Enter admin email and password.');return}try{await signInWithEmailAndPassword(auth,e,p)}catch(x){st($('loginStatus'),x.message)}};
$('logout').onclick=()=>signOut(auth);
async function isAdmin(u){const e=(u.email||'').toLowerCase();if(e===SUPER)return true;const s=await get(ref(db,'admins'));return s.exists()&&Object.values(s.val()).some(a=>String(a.email||'').toLowerCase()===e)}
async function loadProcesses(){const s=await get(ref(db,'processList'));const d=s.exists()?s.val():{};$('proc').innerHTML='<option value="">Select process...</option>'+Object.entries(d).map(([id,v])=>`<option value="${id}">${v.name||id}</option>`).join('')}
async function loadAgents(pid){$('agent').disabled=true;$('agent').innerHTML='<option value="">Loading...</option>';const s=await get(ref(db,`processes/${pid}/agents`));const d=s.exists()?s.val():{};$('agent').innerHTML='<option value="">Select agent...</option>'+Object.entries(d).map(([id,v])=>`<option value="${id}" data-email="${v.email||''}">${v.name||id} (${v.empId||id})</option>`).join('');$('agent').disabled=!Object.keys(d).length}
$('proc').onchange=()=>{const p=$('proc').value;if(p)loadAgents(p).catch(e=>st($('createStatus'),e.message))};$('agent').onchange=()=>{const o=$('agent').selectedOptions[0];$('email').value=o?.dataset?.email||''};
$('create').onclick=async()=>{const processId=$('proc').value,empId=$('agent').value,email=$('email').value.trim().toLowerCase(),password=$('pw').value;if(!processId||!empId||!email||!password){st($('createStatus'),'Select process and agent, then enter email and password.');return}if(password.length<8){st($('createStatus'),'Password must be at least 8 characters.');return}$('create').disabled=true;$('create').textContent='Creating...';try{const token=await auth.currentUser.getIdToken();const r=await fetch(API+'/api/create-agent-login',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({processId,empId,email,password})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');st($('createStatus'),d.created?'✅ Agent login created successfully.':'✅ Existing agent login updated/reset successfully.',true);$('pw').value=''}catch(e){st($('createStatus'),e.message)}finally{$('create').disabled=false;$('create').textContent='🔐 Create Agent Login'}};
onAuthStateChanged((u)=>{});
</script></body></html>
