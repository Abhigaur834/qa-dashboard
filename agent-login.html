<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QA.Hub — Agent Login</title>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;700;800;900&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a12;--s:#0c1220;--s2:#111826;--b:#1c2640;--b2:#2b3856;--a:#3d7ef5;--t:#e8eef8;--m:#7f90ad;--r:#f04060;--g:#22d38a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,rgba(61,126,245,.10),transparent 35%),radial-gradient(circle at 90% 100%,rgba(139,108,245,.08),transparent 35%),var(--bg);color:var(--t);font-family:Onest,sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:linear-gradient(145deg,var(--s),var(--s2));border:1px solid var(--b);border-radius:18px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.42)}.brand{font:900 20px Epilogue;letter-spacing:-.5px}.brand span{color:var(--a)}.sub{font-size:9px;color:var(--m);letter-spacing:1.8px;text-transform:uppercase;margin-top:4px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.8px;color:var(--a);font-weight:800;margin-top:27px}.title{font:800 24px Epilogue;margin-top:8px}.hint{font-size:11px;color:var(--m);line-height:1.5;margin:7px 0 20px}.field{margin-bottom:14px}.field label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--m);font-weight:700;margin-bottom:6px}.field input{width:100%;background:#0a101b;border:1px solid var(--b2);border-radius:9px;color:var(--t);padding:12px;outline:none}.field input:focus{border-color:var(--a)}.btn{width:100%;border:1px solid var(--a);background:var(--a);color:#fff;padding:12px 14px;border-radius:9px;cursor:pointer;font-weight:800;font-size:11px}.btn:disabled{opacity:.55;cursor:not-allowed}.msg{min-height:18px;margin-top:12px;font-size:10px;line-height:1.5}.err{color:var(--r)}.ok{color:var(--g)}.foot{margin-top:18px;padding-top:15px;border-top:1px solid var(--b);font-size:9px;color:var(--m);line-height:1.5}.lock{color:var(--g)}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="brand">QA<span>.</span>Hub</div>
  <div class="sub">Agent Performance Portal</div>
  <div class="eyebrow">Secure sign in</div>
  <div class="title">View your QA performance</div>
  <div class="hint">Use the Employee ID and password provided by your company.</div>
  <div class="field"><label>Employee ID</label><input id="empId" autocomplete="username" placeholder="e.g. EMP10452"></div>
  <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password"></div>
  <button id="login" class="btn">Sign In</button>
  <div id="msg" class="msg"></div>
  <div class="foot"><span class="lock">● Secure session</span> · Your portal only shows your own audits, performance and approved call recordings.</div>
</div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getAuth,signInWithCustomToken}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyCifkNrq_PA8FtW7devgVsaNGXW-Tce0n8',authDomain:'qa-dashboard-system.firebaseapp.com',databaseURL:'https://qa-dashboard-system-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'qa-dashboard-system',storageBucket:'qa-dashboard-system.appspot.com',messagingSenderId:'373240224146',appId:'1:373240224146:web:80576d03fea68b3583894b'};
const API='https://qahub-ai-api-glz7.vercel.app';
const app=initializeApp(firebaseConfig),auth=getAuth(app);
const $=id=>document.getElementById(id);const msg=$('msg');
function show(text,ok=false){msg.textContent=text;msg.className='msg '+(ok?'ok':'err')}
async function login(){
  const empId=$('empId').value.trim();const password=$('password').value;
  if(!empId||!password){show('Enter your Employee ID and password.');return}
  $('login').disabled=true;$('login').textContent='Signing in…';show('');
  try{
    const r=await fetch(API+'/api/agent-id-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({empId,password})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||'Login failed');
    await signInWithCustomToken(auth,d.token);
    show('Login successful. Opening your QA dashboard…',true);
    setTimeout(()=>{location.href='https://htmlpreview.github.io/?https://github.com/Abhigaur834/qa-dashboard/blob/agent-portal-preview/agent-portal-preview.html';},250);
  }catch(e){show(e.message||'Unable to sign in.');$('login').disabled=false;$('login').textContent='Sign In'}
}
$('login').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script>
</body>
</html>
